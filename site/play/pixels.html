<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Computer Sees · AI Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=JetBrains+Mono:wght@500&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../css/theme.css">
<style>
  :root { --ar: 1.3333; }
  .lab { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .lab { grid-template-columns: 1fr; } }
  .wrap { position: relative; }
  #view { image-rendering: pixelated; cursor: crosshair; }
  .probe {
    position: absolute; pointer-events: none; display: none; transform: translate(16px, -50%);
    background: rgba(10,7,32,.9); border: 1px solid var(--stroke); border-radius: 12px;
    padding: .4em .7em; font-family: var(--font-mono); font-size: .9rem; white-space: nowrap;
  }
  .probe .sw { display: inline-block; width: 1em; height: 1em; border-radius: 4px; vertical-align: -.15em; margin-right: .3em; border: 1px solid #fff5; }
  .tabs .btn { padding: .45em .9em; }
  .kernel { display: grid; grid-template-columns: repeat(3, 3.2em); gap: 4px; font-family: var(--font-mono); }
  .kernel span { text-align: center; padding: .45em 0; border-radius: 8px; background: rgba(255,255,255,.08); font-weight: 700; }
  .kernel span.pos { color: var(--lime); } .kernel span.neg { color: var(--red); }
  h3 { font-size: 1.05rem; margin: 0 0 .3rem; color: var(--muted); font-family: var(--font-body); font-weight: 600; }
  .explain { line-height: 1.4; }
  input[type=file] { display: none; }
</style>
</head>
<body class="play">
<div class="aurora"></div><canvas id="particles"></canvas>

<header class="top">
  <h1>👁️ <span class="grad">How a Computer Sees</span></h1>
  <a class="back" href="./">← all activities</a>
</header>

<main class="lab">
  <div class="wrap">
    <canvas class="board cam" id="view" width="640" height="480"></canvas>
    <div class="probe" id="probe"></div>
    <video id="video" playsinline muted style="display:none"></video>
  </div>

  <aside class="glass panel stack">
    <div>
      <h3>Picture</h3>
      <div class="row">
        <button class="btn primary" id="camBtn">🎥 Camera</button>
        <button class="btn" id="sampleBtn">🖼️ Sample</button>
        <label class="btn" for="file">📁 Photo</label><input type="file" id="file" accept="image/*">
      </div>
      <div class="notice hidden" id="camMsg"></div>
    </div>
    <div>
      <h3>What the computer does with it</h3>
      <div class="row tabs" id="tabs">
        <button class="btn on" data-m="pixels">🟪 Pixels</button>
        <button class="btn" data-m="gray">⚫ Gray</button>
        <button class="btn" data-m="edges">✴️ Edges</button>
        <button class="btn" data-m="blur">🌫️ Blur</button>
        <button class="btn" data-m="emboss">🗿 Emboss</button>
        <button class="btn" data-m="sharpen">🔪 Sharpen</button>
      </div>
    </div>
    <div id="sizeBox">
      <h3>Pixel size: <span id="sizeVal" class="mono">24</span></h3>
      <input type="range" id="size" min="2" max="48" value="24">
    </div>
    <div id="kernelBox" style="display:none">
      <h3>The 3×3 filter (slide it over every pixel)</h3>
      <div class="kernel" id="kernel"></div>
    </div>
    <div class="explain" id="explain"></div>
  </aside>
</main>

<script src="../js/fx.js"></script>
<script>
(function () {
  "use strict";
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  const video = document.getElementById("video");
  const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
  const WW = 320, WH = 240; work.width = WW; work.height = WH;
  let source = null, isCam = false, mode = "pixels", size = 24, probe = null;

  const KERNELS = {
    edges:   { k: [-1, -1, -1, -1, 8, -1, -1, -1, -1], gray: true,  bias: 0,
               text: "<b>Edge detector.</b> Big numbers only where brightness <i>changes</i>. The first layer of a real vision network learns filters just like this — nobody programs them." },
    blur:    { k: [1, 2, 1, 2, 4, 2, 1, 2, 1].map((v) => v / 16), gray: false, bias: 0,
               text: "<b>Blur.</b> Each pixel becomes the average of its neighbours. Smooths away noise." },
    emboss:  { k: [-2, -1, 0, -1, 1, 1, 0, 1, 2], gray: true, bias: 128,
               text: "<b>Emboss.</b> Picks out edges facing one direction — like light from the top-left." },
    sharpen: { k: [0, -1, 0, -1, 5, -1, 0, -1, 0], gray: false, bias: 0,
               text: "<b>Sharpen.</b> Boosts the difference between a pixel and its neighbours." },
  };
  const TEXT = {
    pixels: "To a computer a picture is just a <b>grid of numbers</b>. Each square has three: how much <span class='red'>Red</span>, <span class='lime'>Green</span> and <span class='c1'>Blue</span> (0–255). Make the squares big to read them. Hover or tap for exact values.",
    gray:   "<b>Grayscale</b>: one number per pixel instead of three — 0 is black, 255 is white. A 640×480 photo is already <b>307 200</b> numbers!",
  };

  // ---------- sources ----------
  async function useCamera() {
    const msg = document.getElementById("camMsg");
    msg.classList.add("hidden");
    try {
      await FX.startCamera(video);
      source = video; isCam = true;
    } catch (e) {
      msg.innerHTML = "📷 " + (e.friendly || e.message) + "<br>Showing the sample picture instead.";
      msg.classList.remove("hidden");
      useSample();
    }
  }
  function stopCam() { if (isCam) FX.stopCamera(video); isCam = false; }
  function useSample() { stopCam(); FX.loadImage("../img/street.svg").then((i) => { source = i; }); }
  document.getElementById("camBtn").addEventListener("click", useCamera);
  document.getElementById("sampleBtn").addEventListener("click", useSample);
  document.getElementById("file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { stopCam(); source = await FX.imageFromFile(f); } catch (err) { FX.toast(err.message); }
  });

  // ---------- controls ----------
  document.getElementById("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#tabs .btn").forEach((x) => x.classList.toggle("on", x === b));
    mode = b.dataset.m;
    document.getElementById("sizeBox").style.display = mode === "pixels" ? "" : "none";
    const K = KERNELS[mode];
    document.getElementById("kernelBox").style.display = K ? "" : "none";
    if (K) {
      const k = mode === "blur" ? [1, 2, 1, 2, 4, 2, 1, 2, 1].map((v) => v + "/16") : K.k;
      document.getElementById("kernel").innerHTML = k.map((v, i) => `<span class="${K.k[i] > 0 ? "pos" : K.k[i] < 0 ? "neg" : ""}">${v}</span>`).join("");
    }
    document.getElementById("explain").innerHTML = K ? K.text : TEXT[mode];
  });
  const sizeIn = document.getElementById("size");
  sizeIn.addEventListener("input", () => { size = +sizeIn.value; document.getElementById("sizeVal").textContent = size; });
  document.getElementById("explain").innerHTML = TEXT.pixels;

  // ---------- render ----------
  function srcDims(s) { return s === video ? [video.videoWidth, video.videoHeight] : [s.naturalWidth || s.width, s.naturalHeight || s.height]; }
  function drawSource(ctx, w, h) {
    const [sw, sh] = srcDims(source);
    if (!sw || !sh) return false;
    const s = Math.max(w / sw, h / sh), dw = sw * s, dh = sh * s;   // cover
    ctx.save();
    if (isCam) { ctx.translate(w, 0); ctx.scale(-1, 1); }          // mirror: feels like a mirror to students
    ctx.drawImage(source, (w - dw) / 2, (h - dh) / 2, dw, dh);
    ctx.restore();
    return true;
  }

  function convolve(K) {
    const src = wctx.getImageData(0, 0, WW, WH), d = src.data;
    const out = wctx.createImageData(WW, WH), o = out.data, k = K.k;
    if (K.gray) for (let i = 0; i < d.length; i += 4) { const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = g; }
    for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++, n++) {
        const xx = Math.min(WW - 1, Math.max(0, x + dx)), yy = Math.min(WH - 1, Math.max(0, y + dy));
        const i = (yy * WW + xx) * 4, w = k[n];
        r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w;
      }
      const j = (y * WW + x) * 4;
      if (mode === "edges") { const m = Math.min(255, Math.abs(r) * 1.5); o[j] = m * 0.35; o[j + 1] = m * 0.9; o[j + 2] = m; }  // neon cyan edges
      else { o[j] = r + K.bias; o[j + 1] = g + K.bias; o[j + 2] = b + K.bias; }
      o[j + 3] = 255;
    }
    wctx.putImageData(out, 0, 0);
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!source) return;
    const W = view.width, H = view.height;
    if (mode === "pixels") {
      const cols = Math.max(1, Math.round(W / size)), rows = Math.max(1, Math.round(H / size));
      work.width = cols; work.height = rows;
      if (!drawSource(wctx, cols, rows)) return;
      vctx.imageSmoothingEnabled = false;
      vctx.drawImage(work, 0, 0, W, H);
      if (size >= 30) {                 // big squares: print the numbers inside them
        const d = wctx.getImageData(0, 0, cols, rows).data, cw = W / cols, ch = H / rows;
        vctx.font = `600 ${Math.round(cw / 4.2)}px "JetBrains Mono", monospace`;
        vctx.textAlign = "center"; vctx.textBaseline = "middle";
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const i = (y * cols + x) * 4, lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          vctx.fillStyle = lum > 140 ? "rgba(0,0,0,.75)" : "rgba(255,255,255,.85)";
          const cx = (x + .5) * cw, cy = (y + .5) * ch, lh = ch / 3.6;
          vctx.fillText(d[i], cx, cy - lh); vctx.fillText(d[i + 1], cx, cy); vctx.fillText(d[i + 2], cx, cy + lh);
        }
      }
      vctx.strokeStyle = "rgba(0,0,0,.25)"; vctx.lineWidth = 1;
      if (size >= 12) {
        for (let x = 0; x <= cols; x++) { vctx.beginPath(); vctx.moveTo(x * W / cols, 0); vctx.lineTo(x * W / cols, H); vctx.stroke(); }
        for (let y = 0; y <= rows; y++) { vctx.beginPath(); vctx.moveTo(0, y * H / rows); vctx.lineTo(W, y * H / rows); vctx.stroke(); }
      }
    } else {
      work.width = WW; work.height = WH;
      if (!drawSource(wctx, WW, WH)) return;
      if (mode === "gray") {
        const im = wctx.getImageData(0, 0, WW, WH), d = im.data;
        for (let i = 0; i < d.length; i += 4) { const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = g; }
        wctx.putImageData(im, 0, 0);
      } else convolve(KERNELS[mode]);
      vctx.imageSmoothingEnabled = true;
      vctx.drawImage(work, 0, 0, W, H);
    }
    if (probe) showProbe();
  }

  // ---------- probe: exact numbers under the pointer ----------
  const probeEl = document.getElementById("probe");
  view.addEventListener("pointermove", (e) => { e.stopPropagation(); probe = e; showProbe(); });
  view.addEventListener("pointerdown", (e) => { e.stopPropagation(); probe = e; showProbe(); });
  view.addEventListener("pointerleave", () => { probe = null; probeEl.style.display = "none"; });
  function showProbe() {
    const p = FX.canvasPoint(view, probe);
    const d = vctx.getImageData(Math.min(view.width - 1, Math.max(0, p.x | 0)), Math.min(view.height - 1, Math.max(0, p.y | 0)), 1, 1).data;
    const r = view.getBoundingClientRect();
    probeEl.style.display = "block";
    probeEl.style.left = (probe.clientX - r.left) + "px"; probeEl.style.top = (probe.clientY - r.top) + "px";
    probeEl.innerHTML = `<span class="sw" style="background:rgb(${d[0]},${d[1]},${d[2]})"></span><span class="red">R ${d[0]}</span> <span class="lime">G ${d[1]}</span> <span class="c1">B ${d[2]}</span>`;
  }

  useSample();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
