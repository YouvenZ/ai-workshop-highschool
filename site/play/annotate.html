<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%94%B2%3C/text%3E%3C/svg%3E">
<title>Box Labeller · AI Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=JetBrains+Mono:wght@500&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../css/theme.css">
<script>/* before first paint: embedded in the deck? (fx.js loads later, after any CDN libraries) */if(/[?&]embed=1\b/.test(location.search)||window.self!==window.top)document.documentElement.classList.add("embedded");</script>
<style>
  :root { --ar: 1.5; }
  .lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 860px) { .lab { grid-template-columns: 1fr; } }
  .wrap { position: relative; }
  .picker {
    position: absolute; display: none; gap: 6px; flex-wrap: wrap; max-width: 280px;
    padding: 8px; border-radius: 16px; background: rgba(10,7,32,.92); border: 1px solid var(--stroke);
    box-shadow: var(--shadow); z-index: 5;
  }
  .picker .btn { padding: .4em .7em; font-size: .95rem; }
  .json {
    font-family: var(--font-mono); font-size: .78rem; line-height: 1.45;
    background: rgba(0,0,0,.35); border-radius: var(--radius-sm); padding: .6em .8em;
    max-height: 180px; overflow: auto; white-space: pre; color: var(--lime); max-width: 100%;
  }
  .big { font-family: var(--font-display); font-size: 1.6rem; }
  h3 { font-size: 1.05rem; margin: 0; color: var(--muted); font-family: var(--font-body); font-weight: 600; }
</style>
</head>
<body class="play" data-py="annotate">
<div class="aurora"></div><canvas id="particles"></canvas>

<header class="top">
  <h1>🔲 <span class="grad">Box Labeller</span></h1>
  <a class="back" href="./">← all activities</a>
</header>

<main class="lab">
  <div class="wrap">
    <canvas class="board" id="board" width="1200" height="800" aria-label="Drag to draw a box around an object"></canvas>
    <div class="picker" id="picker"></div>
  </div>

  <aside class="glass panel stack">
    <div>
      <h3>Your job</h3>
      <div>Drag a box around <b>every object</b>, then pick its label. This is exactly how the photos used to train self-driving cars are made — by people, one box at a time.</div>
    </div>
    <div class="big" id="progress">0 / 6 objects</div>
    <div class="row">
      <button class="btn cyan" id="compare">👁️ Compare with expert</button>
      <button class="btn" id="undo">↩️ Undo</button>
      <button class="btn" id="clear">🧹 Clear</button>
    </div>
    <div id="result" class="muted"></div>
    <div>
      <h3>What the AI actually receives 👇</h3>
      <div class="json" id="json">[]</div>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/python-snippets.js"></script>
<script src="../js/python-panel.js"></script>
<script>
(function () {
  "use strict";
  const LABELS = [
    { id: "sun",    emo: "☀️", col: "#ffc53d" },
    { id: "house",  emo: "🏠", col: "#ff5a6e" },
    { id: "tree",   emo: "🌳", col: "#b6ff3b" },
    { id: "person", emo: "🧍", col: "#22e4ff" },
    { id: "cat",    emo: "🐱", col: "#ff4fd8" },
    { id: "car",    emo: "🚗", col: "#8b5cff" },
  ];
  // Expert boxes [x0, y0, x1, y1] in image pixels — they match img/street.svg.
  const TRUTH = {
    sun:    [935, 25, 1145, 235],
    house:  [90, 200, 450, 580],
    tree:   [440, 280, 640, 590],
    person: [720, 392, 800, 612],
    cat:    [855, 485, 960, 602],
    car:    [160, 625, 460, 761],
  };
  const board = document.getElementById("board");
  const ctx = board.getContext("2d");
  const picker = document.getElementById("picker");
  let img = null, boxes = [], drag = null, pending = null, showTruth = false;

  FX.loadImage("../img/street.svg").then((i) => { img = i; draw(); })
    .catch(() => { document.getElementById("result").innerHTML = '<div class="notice">The picture didn\'t load — reload the page.</div>'; });

  const lab = (id) => LABELS.find((l) => l.id === id);
  function iou(a, b) {
    const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]));
    const iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const inter = ix * iy, area = (r) => (r[2] - r[0]) * (r[3] - r[1]);
    return inter / (area(a) + area(b) - inter || 1);
  }
  const norm = (a, b) => [Math.min(a.x, b.x), Math.min(a.y, b.y), Math.max(a.x, b.x), Math.max(a.y, b.y)];

  function rect(b, col, dashed, label) {
    ctx.save();
    ctx.lineWidth = 5; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = dashed ? 0 : 14;
    if (dashed) ctx.setLineDash([14, 10]);
    ctx.strokeRect(b[0], b[1], b[2] - b[0], b[3] - b[1]);
    if (!dashed) { ctx.fillStyle = col + "22"; ctx.fillRect(b[0], b[1], b[2] - b[0], b[3] - b[1]); }
    if (label) {
      ctx.setLineDash([]); ctx.shadowBlur = 0;
      ctx.font = "bold 26px Outfit, system-ui, sans-serif";
      const w = ctx.measureText(label).width + 18, y = Math.max(0, b[1] - 36);
      ctx.fillStyle = col; ctx.fillRect(b[0] - 2.5, y, w, 34);
      ctx.fillStyle = "#0a0720"; ctx.fillText(label, b[0] + 7, y + 26);
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, board.width, board.height);
    if (img) ctx.drawImage(img, 0, 0, board.width, board.height);
    if (showTruth) for (const [id, b] of Object.entries(TRUTH)) rect(b, "#ffffff", true, null);
    for (const b of boxes) {
      const L = lab(b.label);
      let tag = `${L.emo} ${b.label}`;
      if (showTruth) tag += ` · ${Math.round(iou(b.box, TRUTH[b.label]) * 100)}%`;
      rect(b.box, L.col, false, tag);
    }
    if (drag) rect(norm(drag.a, drag.b), "#ffffff", false, null);
    if (pending) rect(pending, "#ffffff", true, "?");
  }

  function update() {
    const found = new Set(boxes.map((b) => b.label));
    document.getElementById("progress").textContent = `${found.size} / ${LABELS.length} objects`;
    document.getElementById("json").textContent = boxes.length
      ? "[\n" + boxes.map((b) => `  {"label": "${b.label}", "x": ${Math.round(b.box[0])}, "y": ${Math.round(b.box[1])}, "w": ${Math.round(b.box[2] - b.box[0])}, "h": ${Math.round(b.box[3] - b.box[1])}}`).join(",\n") + "\n]"
      : "[]";
    if (showTruth) score();
    draw();
    if (found.size === LABELS.length && !update.cheered) { update.cheered = true; FX.fireworks(1400); FX.toast("All 6 found! Now press 👁️ Compare with expert"); }
  }

  function score() {
    const res = document.getElementById("result");
    if (!boxes.length) { res.textContent = "Draw some boxes first."; return; }
    const s = boxes.map((b) => iou(b.box, TRUTH[b.label]));
    const avg = s.reduce((a, b) => a + b, 0) / s.length;
    const msg = avg > 0.8 ? "Pro labeller! 🏆" : avg > 0.6 ? "Good boxes 👍" : "A bit sloppy — and the AI would learn sloppy too 😬";
    res.innerHTML = `Box overlap with the expert: <b class="big ${avg > 0.6 ? "lime" : "red"}">${Math.round(avg * 100)}%</b><br>${msg}<br><span class="muted">(Dashed white = expert. A wrong label or loose box teaches the AI the wrong thing.)</span>`;
  }

  // ---------- drawing boxes ----------
  board.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    if (pending) { cancelPick(); }
    board.setPointerCapture(e.pointerId);
    const p = FX.canvasPoint(board, e);
    drag = { a: p, b: p };
  });
  board.addEventListener("pointermove", (e) => {
    if (!drag) return;
    e.stopPropagation();
    drag.b = FX.canvasPoint(board, e); draw();
  });
  const end = (e) => {
    if (!drag) return;
    const b = norm(drag.a, drag.b); drag = null;
    if (b[2] - b[0] < 15 || b[3] - b[1] < 15) { draw(); return; }
    pending = b; draw(); openPick(e);
  };
  board.addEventListener("pointerup", end);
  board.addEventListener("pointercancel", () => { drag = null; draw(); });

  function openPick(e) {
    const wrapR = board.parentElement.getBoundingClientRect();
    picker.innerHTML = LABELS.map((l) => `<button class="btn" data-id="${l.id}" style="border-color:${l.col}">${l.emo} ${l.id}</button>`).join("") +
      '<button class="btn" data-id="">✖</button>';
    picker.style.display = "flex";
    // keep the whole picker inside the picture, flipping above the pointer near the bottom
    const pw = picker.offsetWidth, ph = picker.offsetHeight;
    let y = e.clientY - wrapR.top + 10;
    if (y + ph > wrapR.height) y = e.clientY - wrapR.top - ph - 10;
    const x = Math.min(e.clientX - wrapR.left, wrapR.width - pw);
    picker.style.left = Math.max(0, x) + "px"; picker.style.top = Math.max(0, y) + "px";
  }
  function cancelPick() { pending = null; picker.style.display = "none"; draw(); }
  picker.addEventListener("pointerdown", (e) => e.stopPropagation());
  picker.addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    if (btn.dataset.id) boxes.push({ label: btn.dataset.id, box: pending });
    cancelPick(); update();
  });

  document.getElementById("compare").addEventListener("click", (e) => {
    showTruth = !showTruth;
    e.currentTarget.classList.toggle("on", showTruth);
    if (showTruth) score(); else document.getElementById("result").textContent = "";
    draw();
  });
  document.getElementById("undo").addEventListener("click", () => { boxes.pop(); update(); });
  document.getElementById("clear").addEventListener("click", () => { boxes = []; update.cheered = false; update(); });
  update();
})();
</script>
</body>
</html>
