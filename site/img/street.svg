<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Original illustration for the annotation activity (CC BY 4.0, this repo).
       Object bounding boxes are listed in play/annotate.html as the "expert labels";
       if you move a shape here, update those numbers too. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f8f"/>
      <stop offset="0.55" stop-color="#c2519b"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbf6a"/>
      <stop offset="1" stop-color="#1f7a45"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffc53d"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- far hills -->
  <path d="M0 520 Q 200 430 420 500 T 820 480 T 1200 500 V 800 H 0 Z" fill="#6b3fa0" opacity=".55"/>
  <!-- grass -->
  <rect y="560" width="1200" height="240" fill="url(#grass)"/>
  <!-- road -->
  <rect y="620" width="1200" height="160" fill="#2c2b3a"/>
  <g fill="#f5f2ff" opacity=".8">
    <rect x="40" y="696" width="80" height="10" rx="5"/><rect x="520" y="696" width="80" height="10" rx="5"/>
    <rect x="680" y="696" width="80" height="10" rx="5"/><rect x="840" y="696" width="80" height="10" rx="5"/>
    <rect x="1000" y="696" width="80" height="10" rx="5"/>
  </g>

  <!-- sun  bbox [950,40,1130,220] -->
  <g stroke="#ffc53d" stroke-width="10" stroke-linecap="round">
    <line x1="1040" y1="45" x2="1040" y2="25"/><line x1="1040" y1="215" x2="1040" y2="235"/>
    <line x1="955" y1="130" x2="935" y2="130"/><line x1="1125" y1="130" x2="1145" y2="130"/>
    <line x1="980" y1="70" x2="966" y2="56"/><line x1="1100" y1="70" x2="1114" y2="56"/>
    <line x1="980" y1="190" x2="966" y2="204"/><line x1="1100" y1="190" x2="1114" y2="204"/>
  </g>
  <circle cx="1040" cy="130" r="70" fill="url(#sunG)"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".85">
    <ellipse cx="300" cy="110" rx="80" ry="30"/><ellipse cx="350" cy="95" rx="55" ry="35"/><ellipse cx="250" cy="100" rx="45" ry="28"/>
    <ellipse cx="700" cy="170" rx="70" ry="24"/><ellipse cx="740" cy="158" rx="45" ry="28"/>
  </g>

  <!-- house  bbox [90,200,450,580] -->
  <rect x="120" y="330" width="300" height="250" fill="#ffe3c2"/>
  <polygon points="90,340 270,200 450,340" fill="#e0475f"/>
  <rect x="235" y="460" width="70" height="120" rx="6" fill="#7a3f2a"/>
  <circle cx="292" cy="522" r="5" fill="#ffc53d"/>
  <rect x="150" y="380" width="60" height="60" fill="#8fd8ff" stroke="#fff" stroke-width="6"/>
  <rect x="330" y="380" width="60" height="60" fill="#8fd8ff" stroke="#fff" stroke-width="6"/>

  <!-- tree  bbox [440,270,640,590] -->
  <rect x="520" y="440" width="40" height="150" fill="#7a4a2a"/>
  <circle cx="540" cy="380" r="100" fill="#2f9e57"/>
  <circle cx="490" cy="400" r="50" fill="#37b565"/>
  <circle cx="585" cy="350" r="55" fill="#37b565"/>

  <!-- person  bbox [720,392,800,612] -->
  <g stroke="#1b1440" stroke-width="12" stroke-linecap="round">
    <line x1="760" y1="448" x2="760" y2="540"/>
    <line x1="760" y1="540" x2="735" y2="606"/><line x1="760" y1="540" x2="785" y2="606"/>
    <line x1="760" y1="470" x2="726" y2="515"/><line x1="760" y1="470" x2="794" y2="515"/>
  </g>
  <rect x="742" y="456" width="36" height="60" rx="12" fill="#22a0ff"/>
  <circle cx="760" cy="420" r="28" fill="#ffcf9e"/>
  <path d="M732 414 Q 760 380 788 414 Z" fill="#3a2a1a"/>

  <!-- cat  bbox [855,485,960,602] -->
  <path d="M935 585 Q 965 560 950 530" stroke="#444" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="900" cy="570" rx="40" ry="32" fill="#555"/>
  <polygon points="880,505 884,486 896,500" fill="#555"/>
  <polygon points="904,500 916,486 920,505" fill="#555"/>
  <circle cx="900" cy="520" r="24" fill="#555"/>
  <circle cx="891" cy="517" r="4" fill="#b6ff3b"/><circle cx="909" cy="517" r="4" fill="#b6ff3b"/>

  <!-- car  bbox [160,625,460,761] -->
  <rect x="220" y="625" width="170" height="55" rx="22" fill="#22e4ff"/>
  <rect x="238" y="636" width="62" height="34" rx="8" fill="#bff5ff"/>
  <rect x="310" y="636" width="62" height="34" rx="8" fill="#bff5ff"/>
  <rect x="160" y="668" width="300" height="62" rx="20" fill="#ff4fd8"/>
  <circle cx="450" cy="690" r="7" fill="#ffc53d"/>
  <circle cx="220" cy="735" r="26" fill="#1b1440"/><circle cx="220" cy="735" r="10" fill="#aaa"/>
  <circle cx="400" cy="735" r="26" fill="#1b1440"/><circle cx="400" cy="735" r="10" fill="#aaa"/>
</svg>
